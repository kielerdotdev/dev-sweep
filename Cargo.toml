[package]
name = "dev-sweep"
version = "0.3.4"
edition = "2021"
rust-version = "1.85"
description = "Conservative cleanup of stale development artifacts"
license = "MIT"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
strip = true
lto = true
